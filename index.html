<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helios Lab — Flux vivant</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:sans-serif;
}

#ui{
  position:fixed;
  top:20px;
  left:20px;
  color:white;
  z-index:10;
}

#ui h1{
  font-size:20px;
  margin:0 0 10px;
}

#ui button{
  background:#00eaff;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
  <h1>Helios Lab</h1>
  <button onclick="toggle()">Pause</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w,h,t=0,run=true;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function glow(x,y,r,c){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  requestAnimationFrame(draw);
  if(!run) return;

  t+=0.01;

  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,w,h);

  const cx=w/2;
  const cy=h/2;
  const R=Math.min(w,h)*0.35;

  // halo central
  glow(cx,cy,R*1.4,"rgba(0,255,255,0.05)");
  glow(cx,cy,R*0.6,"rgba(255,200,0,0.05)");

  // spirales
  for(let k=0;k<10;k++){
    ctx.beginPath();

    for(let i=0;i<600;i++){
      let p=i/600;
      let a=p*Math.PI*10 + k + t;
      let r=R*p;

      let x=cx+Math.cos(a)*r;
      let y=cy+Math.sin(a)*r;

      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle=`hsla(${k*30+t*40},100%,60%,0.3)`;
    ctx.lineWidth=1.2;
    ctx.stroke();
  }

  // rosace centrale
  ctx.strokeStyle="rgba(0,255,255,0.3)";
  ctx.lineWidth=1.5;

  ctx.beginPath();
  for(let i=0;i<300;i++){
    let a=i/300*Math.PI*2;
    let r=120+Math.sin(a*8+t)*30;

    let x=cx+Math.cos(a)*r;
    let y=cy+Math.sin(a)*r;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // photons
  for(let i=0;i<120;i++){
    let a=i/120*Math.PI*2 + t;
    let r=R*(0.3+Math.sin(t+i)*0.2);

    let x=cx+Math.cos(a)*r;
    let y=cy+Math.sin(a)*r;

    glow(x,y,6,"rgba(0,255,255,0.2)");
    glow(x,y,2,"rgba(255,255,200,1)");
  }

  // coeur
  glow(cx,cy,40+Math.sin(t*3)*20,"rgba(255,255,255,0.15)");
  glow(cx,cy,10,"rgba(255,255,200,1)");
}

draw();

function toggle(){
  run=!run;
}
</script>

</body>
</html>

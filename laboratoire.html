<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeliosAstro — Laboratoire Photonique</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

canvas{
  display:block;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:60px;
  background:linear-gradient(#02040a,#000);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.topbar a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
}

.topbar a:hover{
  color:#2ea8ff;
}

.title{
  font-weight:bold;
  color:#ffd36a;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">☉ HELIOSASTRO LAB</div>
  <div>
    <a href="./index.html">Accueil</a>
    <a href="./offres.html">Offres</a>
    <a href="./logiciel.html">Logiciel</a>
  </div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w,h,t=0;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function glow(x,y,r,c){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  requestAnimationFrame(draw);
  t+=0.01;

  ctx.fillStyle="black";
  ctx.fillRect(0,0,w,h);

  const cx=w/2;
  const cy=h/2;

  const R = Math.min(w,h)*0.35;

  glow(cx,cy,R*1.2,"rgba(0,255,200,0.04)");
  glow(cx,cy,R*0.8,"rgba(0,120,255,0.05)");

  ctx.strokeStyle="rgba(120,220,255,0.08)";
  ctx.lineWidth=1;

  for(let k=0;k<6;k++){
    let rot = k*Math.PI/3 + t*0.05;

    ctx.beginPath();
    for(let i=0;i<200;i++){
      let a = i/200*Math.PI*2;
      let r = R*0.6 + Math.sin(a*6+t)*20;

      let x = cx + Math.cos(a+rot)*r;
      let y = cy + Math.sin(a+rot)*r*0.8;

      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  for(let i=0;i<40;i++){
    let a = i/40*Math.PI*2 + t;

    let r = R*0.5;

    let x = cx + Math.cos(a)*r;
    let y = cy + Math.sin(a*1.2)*r;

    let pulse = 0.5 + 0.5*Math.sin(t*4+i);

    glow(x,y,8*pulse,"rgba(120,240,255,0.15)");
    glow(x,y,3,"rgba(255,255,180,0.9)");
  }

  let p = 0.5+0.5*Math.sin(t*3);

  glow(cx,cy,40*p,"rgba(255,255,255,0.15)");
  glow(cx,cy,10,"rgba(255,255,200,0.9)");
}

draw();
</script>

</body>
</html>

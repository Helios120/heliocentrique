<script>
window.onload = () => {
  const c = document.getElementById("canvas");
  if(!c) return;

  const ctx = c.getContext("2d");

  function resize(){
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  let t=0;

  function draw(){
    requestAnimationFrame(draw);
    t+=0.01;

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,c.width,c.height);

    const cx=c.width/2;
    const cy=c.height/2;
    const R=Math.min(cx,cy)*0.8;

    for(let i=0;i<12;i++){
      let a=i/12*Math.PI*2 + t;

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(
        cx + Math.cos(a)*R,
        cy + Math.sin(a)*R
      );

      ctx.strokeStyle=`hsl(${i*30},100%,60%)`;
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }

  draw();
}
</script>
